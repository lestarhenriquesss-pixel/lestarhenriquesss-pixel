<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="284" viewBox="0 0 1000 284" role="img" aria-labelledby="title"><title id="title">Histórico semanal de pull requests externos, não de todos os commits.</title><defs></defs><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-1700}}
@keyframes grow{0%,100%{opacity:.72}35%,75%{opacity:1}}
@keyframes rise{0%{transform:translateY(6px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes draw{0%{stroke-dashoffset:1400}30%,100%{stroke-dashoffset:0}}
@keyframes terminal{0%,4%{clip-path:inset(0 100% 0 0)}40%,96%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes typingA{0%,2%{opacity:1;clip-path:inset(0 100% 0 0)}12%,43%{opacity:1;clip-path:inset(0 0 0 0)}49%{opacity:1;clip-path:inset(0 100% 0 0)}50%,100%{opacity:0}}
@keyframes typingB{0%,49%{opacity:0;clip-path:inset(0 100% 0 0)}50%{opacity:1;clip-path:inset(0 100% 0 0)}62%,93%{opacity:1;clip-path:inset(0 0 0 0)}99%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:0}}
.orbit{animation:orbit 28s linear infinite}.breath{animation:breath 5s ease-in-out infinite}
.trace{stroke-dasharray:180 1520;animation:trace 10s linear infinite}
.grow{animation:grow 14s ease-in-out infinite}.rise{animation:rise 1.2s ease-out both}
.draw{stroke-dasharray:1400;animation:draw 12s ease-in-out infinite}
.terminal{animation:terminal 16s steps(65,end) infinite}
.cursor{animation:cursor 1.1s steps(1,end) infinite}
.typing-a{animation:typingA 14s steps(48,end) infinite}
.typing-b{opacity:0;animation:typingB 14s steps(48,end) infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.motion{display:none!important}.typing-a{opacity:1!important;clip-path:none!important}.typing-b{display:none!important}.terminal{clip-path:none!important}}
</style><rect x="1" y="1" width="998" height="282" rx="20" fill="#090F1C" stroke="#263850" /><text x="26" y="37" fill="#ECF4FF" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" text-anchor="start" >Ritmo de colaboração</text><text x="26" y="60" fill="#A4B5CE" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="12" font-weight="400" text-anchor="start" >PRs propostos por semana · últimos 91 dias</text><line x1="44" y1="226.0" x2="967" y2="226.0" stroke="#263950" stroke-width="1" stroke-dasharray="3 6"/><text x="32" y="230.0" fill="#70849E" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="end" >0</text><line x1="44" y1="191.5" x2="967" y2="191.5" stroke="#263950" stroke-width="1" stroke-dasharray="3 6"/><text x="32" y="195.5" fill="#70849E" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="end" >1</text><line x1="44" y1="157.0" x2="967" y2="157.0" stroke="#263950" stroke-width="1" stroke-dasharray="3 6"/><text x="32" y="161.0" fill="#70849E" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="end" >2</text><line x1="44" y1="122.5" x2="967" y2="122.5" stroke="#263950" stroke-width="1" stroke-dasharray="3 6"/><text x="32" y="126.5" fill="#70849E" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="end" >3</text><line x1="44" y1="88.0" x2="967" y2="88.0" stroke="#263950" stroke-width="1" stroke-dasharray="3 6"/><text x="32" y="92.0" fill="#70849E" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="end" >4</text><polygon points="44,226 44.00,226.00 120.92,226.00 197.83,226.00 274.75,191.50 351.67,226.00 428.58,226.00 505.50,226.00 582.42,226.00 659.33,226.00 736.25,226.00 813.17,88.00 890.08,157.00 967.00,191.50 967,226" fill="#509AFF" opacity=".09"/><polyline points="44.00,226.00 120.92,226.00 197.83,226.00 274.75,191.50 351.67,226.00 428.58,226.00 505.50,226.00 582.42,226.00 659.33,226.00 736.25,226.00 813.17,88.00 890.08,157.00 967.00,191.50" fill="none" stroke="#509AFF" stroke-width="2.5" stroke-linejoin="round" class="draw"/><circle cx="274.75" cy="191.5" r="4" fill="#5DE8E5" /><text x="274.75" y="181.5" fill="#ECF4FF" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="middle" >1</text><circle cx="813.1666666666666" cy="88.0" r="4" fill="#5DE8E5" /><text x="813.1666666666666" y="78.0" fill="#ECF4FF" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="middle" >4</text><circle cx="890.0833333333334" cy="157.0" r="4" fill="#5DE8E5" /><text x="890.0833333333334" y="147.0" fill="#ECF4FF" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="middle" >2</text><circle cx="967.0" cy="191.5" r="4" fill="#5DE8E5" /><text x="967.0" y="181.5" fill="#ECF4FF" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="middle" >1</text><text x="44.0" y="251" fill="#70849E" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" >15/06</text><text x="351.6666666666667" y="251" fill="#70849E" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" >13/07</text><text x="659.3333333333334" y="251" fill="#70849E" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" >10/08</text><text x="967.0" y="251" fill="#70849E" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="middle" >07/09</text><text x="26" y="269" fill="#A4B5CE" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="start" >Recorte de PRs externos; não representa todos os commits.</text></svg>