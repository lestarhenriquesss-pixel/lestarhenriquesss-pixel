<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title"><title id="title">Lestar Henriques — Engenharia de Dados e Business Intelligence</title><defs><linearGradient id="hero-grad" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#090F1C"/><stop offset=".68" stop-color="#0C1B32"/><stop offset="1" stop-color="#123A67"/></linearGradient><radialGradient id="hero-glow"><stop stop-color="#2C87EF" stop-opacity=".22"/><stop offset="1" stop-color="#2C87EF" stop-opacity="0"/></radialGradient></defs><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-1700}}
@keyframes grow{0%,100%{opacity:.72}35%,75%{opacity:1}}
@keyframes rise{0%{transform:translateY(6px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes draw{0%{stroke-dashoffset:1400}30%,100%{stroke-dashoffset:0}}
@keyframes terminal{0%,4%{clip-path:inset(0 100% 0 0)}40%,96%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
