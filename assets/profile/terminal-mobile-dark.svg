<svg xmlns="http://www.w3.org/2000/svg" width="500" height="335" viewBox="0 0 500 335" role="img" aria-labelledby="title"><title id="title">Apresentação em terminal: conecto dados, análise e desenvolvimento.</title><defs></defs><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-1700}}
@keyframes grow{0%,100%{opacity:.72}35%,75%{opacity:1}}
@keyframes rise{0%{transform:translateY(6px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes draw{0%{stroke-dashoffset:1400}30%,100%{stroke-dashoffset:0}}
@keyframes terminal{0%,4%{clip-path:inset(0 100% 0 0)}40%,96%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes typingA{0%,2%{opacity:1;clip-path:inset(0 100% 0 0)}12%,43%{opacity:1;clip-path:inset(0 0 0 0)}49%{opacity:1;clip-path:inset(0 100% 0 0)}50%,100%{opacity:0}}
@keyframes typingB{0%,49%{opacity:0;clip-path:inset(0 100% 0 0)}50%{opacity:1;clip-path:inset(0 100% 0 0)}62%,93%{opacity:1;clip-path:inset(0 0 0 0)}99%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:0}}
.orbit{animation:orbit 28s linear infinite}.breath{animation:breath 5s ease-in-out infinite}
.trace{stroke-dasharray:180 1520;animation:trace 10s linear infinite}
.grow{animation:grow 14s ease-in-out infinite}.rise{animation:rise 1.2s ease-out both}
.draw{stroke-dasharray:1400;animation:draw 12s ease-in-out infinite}
.terminal{animation:terminal 16s steps(65,end) infinite}
.cursor{animation:cursor 1.1s steps(1,end) infinite}
.typing-a{animation:typingA 14s steps(48,end) infinite}
.typing-b{opacity:0;animation:typingB 14s steps(48,end) infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.motion{display:none!important}.typing-a{opacity:1!important;clip-path:none!important}.typing-b{display:none!important}.terminal{clip-path:none!important}}
</style><rect x="1" y="1" width="498" height="333" rx="20" fill="#090F1C" stroke="#263850" /><rect x="2" y="2" width="496" height="40" rx="18" fill="#101A2C" stroke="none" /><line x1="2" y1="43" x2="498" y2="43" stroke="#263850" stroke-width="1" /><circle cx="25" cy="22" r="4" fill="#FFC278" /><circle cx="43" cy="22" r="4" fill="#5DE8E5" /><circle cx="61" cy="22" r="4" fill="#509AFF" /><text x="92" y="27" fill="#A4B5CE" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="400" text-anchor="start" >lestar@dados: ~/sobre-mim</text><text x="28" y="80" fill="#5DE8E5" font-family="Consolas,Menlo,monospace" font-size="16" font-weight="600" text-anchor="start" >$ whoami</text><g class="terminal"><text x="28" y="112" fill="#ECF4FF" font-family="Consolas,Menlo,monospace" font-size="21" font-weight="600" text-anchor="start" >Lestar Henriques</text><text x="28" y="144" fill="#A4B5CE" font-family="Consolas,Menlo,monospace" font-size="18" font-weight="400" text-anchor="start" >Dados + análise + desenvolvimento</text></g><text x="28" y="193" fill="#5DE8E5" font-family="Consolas,Menlo,monospace" font-size="16" font-weight="600" text-anchor="start" >$ propósito</text><text x="28" y="229" fill="#ECF4FF" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" >Dados confiáveis. Indicadores claros.</text><text x="28" y="260" fill="#ECF4FF" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" >Tecnologia aplicada à rotina.</text><rect x="28" y="285" width="9" height="18" rx="1" fill="#FFC278" stroke="none" class="cursor"/></svg>