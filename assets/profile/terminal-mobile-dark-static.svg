<svg xmlns="http://www.w3.org/2000/svg" width="500" height="335" viewBox="0 0 500 335" role="img" aria-labelledby="title"><title id="title">Apresentação em terminal: conecto dados, análise e desenvolvimento.</title><defs /><rect x="1" y="1" width="498" height="333" rx="20" fill="#090F1C" stroke="#263850" /><rect x="2" y="2" width="496" height="40" rx="18" fill="#101A2C" stroke="none" /><line x1="2" y1="43" x2="498" y2="43" stroke="#263850" stroke-width="1" /><circle cx="25" cy="22" r="4" fill="#FFC278" /><circle cx="43" cy="22" r="4" fill="#5DE8E5" /><circle cx="61" cy="22" r="4" fill="#509AFF" /><text x="92" y="27" fill="#A4B5CE" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="400" text-anchor="start">lestar@dados: ~/sobre-mim</text><text x="28" y="80" fill="#5DE8E5" font-family="Consolas,Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">$ whoami</text><g class="terminal"><text x="28" y="112" fill="#ECF4FF" font-family="Consolas,Menlo,monospace" font-size="21" font-weight="600" text-anchor="start">Lestar Henriques</text><text x="28" y="144" fill="#A4B5CE" font-family="Consolas,Menlo,monospace" font-size="18" font-weight="400" text-anchor="start">Dados + análise + desenvolvimento</text></g><text x="28" y="193" fill="#5DE8E5" font-family="Consolas,Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">$ propósito</text><text x="28" y="229" fill="#ECF4FF" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Dados confiáveis. Indicadores claros.</text><text x="28" y="260" fill="#ECF4FF" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Tecnologia aplicada à rotina.</text><rect x="28" y="285" width="9" height="18" rx="1" fill="#FFC278" stroke="none" class="cursor" /></svg>